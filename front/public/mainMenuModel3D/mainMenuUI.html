<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <!-- fontawesome cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @font-face {
            font-family: 'KenaFont';
            src: url('https://github.com/google/fonts/raw/main/ofl/imfellenglishsc/IMFellEnglishSC-Regular.ttf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: url('../img/Elegant.jpg') no-repeat center center/cover;
            color: white;
            overflow: hidden;
        }

        .menu-container {
            text-align: left;
            position: absolute;
            left: 5%;
            top: 30%;
            z-index: 2;
        }

        .title {
            font-size: 50px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu a {
            font-size: 24px;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            transition: all 0.3s ease;
            display: block;
            width: fit-content;
            position: relative;
        }

        .menu a:hover {
            text-shadow: 0px 0px 15px white;
            transform: scale(1.1);
        }

        /* Estilos para el popup del carrito */
        .popup-container {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            width: 300px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
        }

        .popup-container h3 {
            color: #731D3C;
            margin-bottom: 10px;
            text-align: center;
        }

        .popup-items {
            max-height: 200px;
            overflow-y: auto;
        }

        .popup-footer {
            margin-top: 15px;
            text-align: center;
        }

        .popup-btn {
            background: #731D3C;
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .popup-btn:hover {
            background: #A65168;
        }
    </style>
</head>
<body>
    <!-- header section starts -->
    <header class="header">
        <div class="left-section">
            <!-- Menú hamburguesa -->
            <a href="#" id="menu" class="menu-icon"><i class="fas fa-bars"></i></a>
            <!-- Logo -->
            <a href="#" class="logo"><i class="fas fa-cake"></i> </a>
        </div>

        <!-- Menú desplegable de opciones de usuario -->
        <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
            <ul>
                <li><a href="../components/perfil.html"><i class="fas fa-user"></i> Mi Perfil</a></li>
                <li><a href="../components/pedidos.html"><i class="fas fa-box"></i> Mis Pedidos</a></li>
                <li><a href="../components/favoritos.html"><i class="fas fa-heart"></i> Favoritos</a></li>
                <li><a href="../components/ayuda.html"><i class="fas fa-question-circle"></i> Centro de Ayuda</a></li>
                <li><a href="../components/configuracion.html"><i class="fas fa-cog"></i> Configuración</a></li>
                <li><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
            </ul>
        </div>

        <nav class="navbar">
            <a href="../components/home.html">Home</a>
            <a href="../components/categorias.html">Pasteles</a>
            <a href="../components/reposteros.html">Reposteros</a>
            <a href="../components/loadingCake.html" class="active">Crear Pastel</a>
        </nav>

        <div class="header-right">
            <div class="search-bar">
                <input type="text" placeholder="Buscar aquí..." class="search-input">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-section">
                <a href="#" title="Notificaciones">
                    <i class="fas fa-bell fa-lg"></i>
                </a>
            </div>

            <div class="cart-section">
                <a href="javascript:void(0);" id="cart-icon" title="Carrito de compras">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                </a>
            </div>       

            <!-- Cuadro emergente del carrito -->
            <div id="cart-popup" class="popup-container">
                <h3>Carrito de Compras</h3>
                <div class="popup-items">
                    <!-- Aquí se agregarán los productos del carrito -->
                </div>
                <div class="popup-footer">
                    <a href="../components/carrito.html" class="popup-btn">Ver Carrito</a>
                </div>
            </div>

            <div class="profile-icon-section">
                <a href="../index.html" title="Registro">
                    <i class="fas fa-user-plus fa-lg"></i>
                </a>
            </div>
        </div>
    </header>
    <!-- header section ends -->

    <!-- Main Content -->
    <div class="menu-container">
        <h1 class="title">BORCELLE</h1>
        <div class="menu">
            <a href="Menu3D.html">Crear Pastel</a>
            <a href="#">Pasteles Guardados</a>
            <a href="../components/home.html">Salir</a>
        </div>
    </div>

    <script src="../js/menu.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
