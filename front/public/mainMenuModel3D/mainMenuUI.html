<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <!-- fontawesome cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <!-- custom css link -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @font-face {
            font-family: 'KenaFont';
            src: url('https://github.com/google/fonts/raw/main/ofl/imfellenglishsc/IMFellEnglishSC-Regular.ttf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: url('../img/Elegant.jpg') no-repeat center center/cover;
            color: white;
            overflow: hidden;
        }

        .menu-container {
            text-align: left;
            position: absolute;
            left: 5%;
            top: 30%;
            z-index: 2;
        }

        .title {
            font-size: 50px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu a {
            font-size: 24px;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            transition: all 0.3s ease;
            display: block;
            width: fit-content;
            position: relative;
        }

        .menu a:hover {
            text-shadow: 0px 0px 15px white;
            transform: scale(1.1);
        }

        /* Estilos para el popup del carrito */
        .popup-container {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            width: 300px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
        }

        .popup-container h3 {
            color: #731D3C;
            margin-bottom: 10px;
            text-align: center;
        }

        .popup-items {
            max-height: 200px;
            overflow-y: auto;
        }

        .popup-footer {
            margin-top: 15px;
            text-align: center;
        }

        .popup-btn {
            background: #731D3C;
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .popup-btn:hover {
            background: #A65168;
        }

        .saved-cakes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .saved-cake-card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }

        .saved-cake-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .saved-cake-details {
            margin-bottom: 1.5rem;
        }

        .saved-cake-details h3 {
            color: var(--main-color);
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 1.4rem;
        }

        .detail-label {
            font-weight: bold;
            color: #666;
        }

        .tasting-info {
            background: #fff5f5;
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
        }

        .tasting-info h4 {
            color: var(--main-color);
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }

        .cake-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .cake-actions button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1.4rem;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: var(--main-color);
            color: white;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
        }

        .cake-actions button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- header section starts -->
    <header class="header">
        <div class="left-section">
            <!-- Menú hamburguesa -->
            <a href="#" id="menu" class="menu-icon"><i class="fas fa-bars"></i></a>
            <!-- Logo -->
            <a href="#" class="logo"><i class="fas fa-cake"></i> </a>
        </div>

        <!-- Menú desplegable de opciones de usuario -->
        <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
            <ul>
                <li><a href="../components/perfil.html"><i class="fas fa-user"></i> Mi Perfil</a></li>
                <li><a href="../components/pedidos.html"><i class="fas fa-box"></i> Mis Pedidos</a></li>
                <li><a href="../components/citas.html"><i class="fas fa-calendar-alt"></i> Mis Citas</a></li>
                <li><a href="../components/favoritos.html"><i class="fas fa-heart"></i> Favoritos</a></li>
                <li><a href="../components/ayuda.html"><i class="fas fa-question-circle"></i> Centro de Ayuda</a></li>
                <li><a href="../components/configuracion.html"><i class="fas fa-cog"></i> Configuración</a></li>
                <li><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
            </ul>
        </div>

        <nav class="navbar">
            <a href="../components/home.html">Home</a>
            <a href="../components/categorias.html">Pasteles</a>
            <a href="../components/reposteros.html">Reposteros</a>
            <a href="../components/loadingCake.html" class="active">Crear Pastel</a>
        </nav>

        <div class="header-right">
            <div class="search-bar">
                <input type="text" placeholder="Buscar aquí..." class="search-input">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-section">
                <a href="#" title="Notificaciones">
                    <i class="fas fa-bell fa-lg"></i>
                </a>
            </div>

            <div class="cart-section">
                <a href="javascript:void(0);" id="cart-icon" title="Carrito de compras">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                </a>
            </div>       

            <!-- Cuadro emergente del carrito -->
            <div id="cart-popup" class="popup-container">
                <h3>Carrito de Compras</h3>
                <div class="popup-items">
                    <!-- Aquí se agregarán los productos del carrito -->
                </div>
                <div class="popup-footer">
                    <a href="../components/carrito.html" class="popup-btn">Ver Carrito</a>
                </div>
            </div>

            <div class="profile-icon-section">
                <a href="../index.html" title="Registro">
                    <i class="fas fa-user-plus fa-lg"></i>
                </a>
            </div>
        </div>
    </header>
    <!-- header section ends -->

    <!-- Main Content -->
    <div class="menu-container">
        <h1 class="title">BORCELLE</h1>
        <div class="menu">
            <a href="Menu3D.html">Crear Pastel</a>
            <a href="#">Pasteles Guardados</a>
            <a href="../components/home.html">Salir</a>
        </div>
    </div>

    <div class="menu-section">
        <h2>Pasteles Guardados</h2>
        <div id="pasteles-guardados" class="saved-cakes-container">
            <!-- Los pasteles guardados se mostrarán aquí -->
        </div>
    </div>

    <script src="../js/menu.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/search.js"></script>
    <script>
        // Función para cargar los pasteles guardados
        function cargarPastelesGuardados() {
            const container = document.getElementById('pasteles-guardados');
            
            // Recuperar pasteles guardados del localStorage
            const pastelesGuardados = JSON.parse(localStorage.getItem('pastelesGuardados')) || [];
            
            container.innerHTML = pastelesGuardados.map((pastel, index) => `
                <div class="saved-cake-card">
                    <img src="${pastel.imagen || 'https://i.pinimg.com/736x/8d/4d/20/8d4d20b75a8d8b13e3d2907c5c58e633.jpg'}" alt="Pastel guardado">
                    <div class="saved-cake-details">
                        <h3>Pastel Personalizado #${index + 1}</h3>
                        <div class="detail-item">
                            <span class="detail-label">Tamaño:</span>
                            <span>${pastel.tamaño}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Sabor:</span>
                            <span>${pastel.sabor}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Color Principal:</span>
                            <span>${pastel.color_principal}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Color Secundario:</span>
                            <span>${pastel.color_secundario || 'No especificado'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Decoración:</span>
                            <span>${pastel.decoracion || 'No especificada'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Mensaje:</span>
                            <span>${pastel.mensaje || 'No especificado'}</span>
                        </div>
                    </div>
                    ${pastel.repostero ? `
                        <div class="tasting-info">
                            <h4>Degustación Programada</h4>
                            <div class="detail-item">
                                <span class="detail-label">Repostero:</span>
                                <span>${pastel.repostero}</span>
                            </div>
                        </div>
                    ` : ''}
                    <div class="cake-actions">
                        <button class="edit-btn" onclick="editarPastel(${index})">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <button class="delete-btn" onclick="eliminarPastel(${index})">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Función para editar un pastel guardado
        function editarPastel(index) {
            const pastelesGuardados = JSON.parse(localStorage.getItem('pastelesGuardados')) || [];
            const pastel = pastelesGuardados[index];
            localStorage.setItem('pastelEnEdicion', JSON.stringify(pastel));
            window.location.href = '../components/editar-pastel.html';
        }

        // Función para eliminar un pastel guardado
        function eliminarPastel(index) {
            if (confirm('¿Estás seguro de que deseas eliminar este pastel?')) {
                const pastelesGuardados = JSON.parse(localStorage.getItem('pastelesGuardados')) || [];
                pastelesGuardados.splice(index, 1);
                localStorage.setItem('pastelesGuardados', JSON.stringify(pastelesGuardados));
                cargarPastelesGuardados();
            }
        }

        // Cargar pasteles guardados al iniciar la página
        document.addEventListener('DOMContentLoaded', cargarPastelesGuardados);
    </script>
</body>
</html>
