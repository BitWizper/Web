<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasteles Guardados</title>
    <!-- fontawesome cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <!-- custom css link -->
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .pasteles-container {
            padding: 2rem;
            margin-top: 8rem;
            width: 90%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .pasteles-titulo {
            color: #731D3C;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .pasteles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .pastel-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .pastel-card:hover {
            transform: translateY(-5px);
        }

        .pastel-imagen {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .pastel-info {
            padding: 1.5rem;
        }

        .pastel-nombre {
            color: #731D3C;
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }

        .pastel-detalles {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .pastel-detalles p {
            margin: 0.5rem 0;
        }

        .botones {
            display: flex;
            gap: 1rem;
        }

        .btn-editar, .btn-eliminar {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-editar {
            background: #731D3C;
            color: white;
        }

        .btn-eliminar {
            background: #ff4444;
            color: white;
        }

        .btn-editar:hover {
            background: #5a1730;
        }

        .btn-eliminar:hover {
            background: #cc0000;
        }

        .no-pasteles {
            text-align: center;
            color: #666;
            font-size: 1.6rem;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-crear-nuevo {
            display: inline-block;
            margin-top: 1rem;
            padding: 1rem 2rem;
            background: #731D3C;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-crear-nuevo:hover {
            background: #5a1730;
        }
    </style>
</head>
<body>
    <!-- header section starts -->
    <header class="header">
        <div class="left-section">
            <a href="#" id="menu" class="menu-icon"><i class="fas fa-bars"></i></a>
            <a href="#" class="logo"><i class="fas fa-cake"></i></a>
        </div>

        <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
            <ul>
                <li><a href="../components/perfil.html"><i class="fas fa-user"></i> Mi Perfil</a></li>
                <li><a href="../components/pedidos.html"><i class="fas fa-box"></i> Mis Pedidos</a></li>
                <li><a href="../components/citas.html"><i class="fas fa-calendar-alt"></i> Mis Citas</a></li>
                <li><a href="../components/favoritos.html"><i class="fas fa-heart"></i> Favoritos</a></li>
                <li><a href="../components/ayuda.html"><i class="fas fa-question-circle"></i> Centro de Ayuda</a></li>
                <li><a href="../components/configuracion.html"><i class="fas fa-cog"></i> Configuración</a></li>
                <li><a href="../../index.html"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
            </ul>
        </div>

        <nav class="navbar">
            <a href="../components/home.html">Home</a>
            <a href="../components/categorias.html">Pasteles</a>
            <a href="../components/reposteros.html">Reposteros</a>
            <a href="Menu3D.html">Crear Pastel</a>
        </nav>

        <div class="header-right">
            <div class="search-bar">
                <input type="text" placeholder="Buscar aquí..." class="search-input">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-section">
                <a href="#" title="Notificaciones">
                    <i class="fas fa-bell fa-lg"></i>
                </a>
            </div>
            <div class="cart-section">
                <a href="../components/carrito.html" title="Carrito de compras">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                </a>
            </div>
            <div class="profile-icon-section">
                <a href="../../index.html" title="Registro">
                    <i class="fas fa-user-plus fa-lg"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <div class="pasteles-container">
        <h1 class="pasteles-titulo">Mis Pasteles Guardados</h1>
        <div class="pasteles-grid" id="pasteles-container">
            <!-- Los pasteles se cargarán aquí dinámicamente -->
        </div>
    </div>

    <script src="../../js/menu.js"></script>
    <script>
        function cargarPastelesGuardados() {
            const pastelesContainer = document.getElementById('pasteles-container');
            const pastelesGuardados = JSON.parse(localStorage.getItem('pastelesGuardados')) || [];

            if (pastelesGuardados.length === 0) {
                pastelesContainer.innerHTML = `
                    <div class="no-pasteles">
                        <p>No tienes pasteles guardados</p>
                        <button onclick="window.location.href='Menu3D.html'" class="btn-crear-nuevo">
                            Crear Nuevo Pastel
                        </button>
                    </div>`;
                return;
            }

            pastelesContainer.innerHTML = pastelesGuardados.map(pastel => `
                <div class="pastel-card">
                    <img src="${pastel.imagen || '../../images/default-cake.jpg'}" alt="${pastel.nombre}" class="pastel-imagen">
                    <div class="pastel-info">
                        <h3 class="pastel-nombre">${pastel.nombre}</h3>
                        <div class="pastel-detalles">
                            <p>Tamaño: ${pastel.tamaño}</p>
                            <p>Sabor: ${pastel.sabor}</p>
                            <p>Color: ${pastel.color_principal}</p>
                            <p>Decoración: ${pastel.decoracion}</p>
                        </div>
                        <div class="botones">
                            <button onclick="editarPastel('${pastel.id_pastel}')" class="btn-editar">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                            <button onclick="eliminarPastel('${pastel.id_pastel}')" class="btn-eliminar">
                                <i class="fas fa-trash"></i> Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function editarPastel(id_pastel) {
            const pastelesGuardados = JSON.parse(localStorage.getItem('pastelesGuardados')) || [];
            const pastelSeleccionado = pastelesGuardados.find(p => p.id_pastel === id_pastel);
            
            if (pastelSeleccionado) {
                // Guardamos el pastel seleccionado en localStorage para accederlo en la página de edición
                localStorage.setItem('pastelEditar', JSON.stringify(pastelSeleccionado));
                window.location.href = '../components/editar-pastel.html?editar=true';
            }
        }

        function eliminarPastel(id_pastel) {
            if (confirm('¿Estás seguro de que deseas eliminar este pastel?')) {
                const pastelesGuardados = JSON.parse(localStorage.getItem('pastelesGuardados')) || [];
                const nuevosPateles = pastelesGuardados.filter(p => p.id_pastel !== id_pastel);
                localStorage.setItem('pastelesGuardados', JSON.stringify(nuevosPateles));
                cargarPastelesGuardados();
            }
        }

        // Cargar pasteles al iniciar la página
        document.addEventListener('DOMContentLoaded', cargarPastelesGuardados);
    </script>
</body>
</html>
