<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseña tu Pastel</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
    
    <link rel="stylesheet" href="../mainMenuModel3D/css/3d.css">
</head>
<body>
    <div class="ui-container">
        <div class="sidebar">
            <!-- Botón de Regresar -->
            <button class="back-button" onclick="goBack()">⬅ Regresar</button>

            <h2 id="sidebarTitle">Selecciona una opción</h2>
            <div id="capasOptions" class="scroll-view">
                
            </div>
            <div id="bizcochoList" class="scroll-view"></div>
            <div id="rellenoList" class="scroll-view"></div>
            <div id="decoracionesList" class="scroll-view"></div>

           
        </div>
        
        <div class="cake-container">
            <canvas id="cakeCanvas"></canvas>
        </div>

        <div class="controls">
            <button onclick="showCapas()">Capas</button>
            <button onclick="showBizcocho()">Bizcocho</button>
            <button onclick="showRelleno()">Relleno</button>
            <button onclick="showDecoraciones()">Decoraciones</button>
            <button onclick="resetCake()">Reiniciar</button>
            <button onclick="saveCake()">Guardar</button>
        </div>
    </div>

    <script src="../mainMenuModel3D/js/model3d.js"></script>
</body>
</html>
