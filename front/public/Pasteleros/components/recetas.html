<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Repostero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #ffb6c1;
            padding-top: 20px;
            position: fixed;
            transition: 0.3s;
        }
        .sidebar a {
            display: block;
            padding: 15px;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
        }
        .sidebar a:hover {
            background: #ff69b4;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="pedidos.html"><i class="fa fa-box"></i> Pedidos</a>
        <a href="recetas.html"><i class="fa fa-birthday-cake"></i> Productos y Recetas</a>
        <a href="produccion.html"><i class="fa fa-chart-line"></i> Producción y Entregas</a>
        <a href="historial.html"><i class="fa fa-history"></i> Historial de Pedidos</a>
        <a href="citas.html"><i class="fa fa-calendar"></i> Agendar Citas</a>
        <a href="notificaciones.html"><i class="fa fa-bell"></i> Notificaciones</a>
        <a href="configuracion.html"><i class="fa fa-cog"></i> Configuración</a>
    </div>
    <div class="content">
        <h2 class="text-2xl font-bold">Productos y Recetas</h2>
        <button class="bg-blue-500 text-white px-4 py-2 rounded my-4">Agregar Producto</button>
        <table class="w-full mt-4 border rounded-lg overflow-hidden">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-2 text-left">Nombre</th>
                    <th class="p-2 text-left">Categoría</th>
                    <th class="p-2 text-left">Precio</th>
                    <th class="p-2 text-left">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b">
                    <td class="p-2">Pastel de Chocolate</td>
                    <td class="p-2">Pastel</td>
                    <td class="p-2">$25.00</td>
                    <td class="p-2">
                        <button class="bg-yellow-500 text-white px-3 py-1 rounded">Editar</button>
                        <button class="bg-red-500 text-white px-3 py-1 rounded">Eliminar</button>
                    </td>
                </tr>
                <tr>
                    <td class="p-2">Cupcake de Vainilla</td>
                    <td class="p-2">Cupcake</td>
                    <td class="p-2">$3.50</td>
                    <td class="p-2">
                        <button class="bg-yellow-500 text-white px-3 py-1 rounded">Editar</button>
                        <button class="bg-red-500 text-white px-3 py-1 rounded">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
