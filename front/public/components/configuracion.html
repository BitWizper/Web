<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Asegúrate de que tu archivo CSS esté bien vinculado -->
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f2f2;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #d78fa4;
        }

        .back-btn {
            font-size: 24px;
            cursor: pointer;
            color: #d78fa4;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background-color: #d78fa4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #c77490;
        }

        .section-title {
            font-size: 1.2em;
            color: #d78fa4;
            margin-top: 30px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Botón de regreso -->
        <span class="back-btn" onclick="window.location.href='home.html'">
            ↩ <!-- Flecha personalizada -->
        </span>

        <h2>Configuración de Cuenta</h2>

        <!-- Sección de Cambiar Contraseña -->
        <div class="form-group">
            <h3 class="section-title">Cambiar Contraseña</h3>
            <label for="currentPassword">Contraseña Actual:</label>
            <input type="password" id="currentPassword" name="currentPassword" required>

            <label for="newPassword">Nueva Contraseña:</label>
            <input type="password" id="newPassword" name="newPassword" required>

            <label for="confirmPassword">Confirmar Nueva Contraseña:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>

            <button type="submit">Actualizar Contraseña</button>
        </div>

        <!-- Sección de Preferencias de Idioma -->
        <div class="form-group">
            <h3 class="section-title">Idioma</h3>
            <label for="language">Seleccionar Idioma:</label>
            <select id="language" name="language">
                <option value="es">Español</option>
                <option value="en">Inglés</option>
                <option value="fr">Francés</option>
                <option value="de">Alemán</option>
            </select>
            <button type="submit">Guardar Preferencias</button>
        </div>

        <!-- Sección de Preferencias de Privacidad -->
        <div class="form-group">
            <h3 class="section-title">Privacidad</h3>
            <label for="emailNotifications">Recibir Notificaciones por Correo Electrónico:</label>
            <input type="checkbox" id="emailNotifications" name="emailNotifications">
            
            <label for="showProfile">Mostrar mi perfil públicamente:</label>
            <input type="checkbox" id="showProfile" name="showProfile">
            
            <button type="submit">Actualizar Preferencias de Privacidad</button>
        </div>
    </div>
</body>
</html>
