<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #dfb47a; /* Dorado pastel */
      --primary-color: #a63d40; /* Burdeos */
      --secondary-color: #f8f1e7; /* Beige claro */
      --black: #13131a;
      --box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
    }

    * {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      text-decoration: none;
      transition: all .3s ease-in-out;
    }

    body {
      background: url('https://i.pinimg.com/736x/be/99/c4/be99c4ada20cedd3ded33bcf9e53374f.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    /* Overlay para mejorar legibilidad */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      background: var(--secondary-color);
      padding: 3rem 2rem;
      border-radius: 10px;
      box-shadow: var(--box-shadow);
      max-width: 400px;
      width: 90%;
    }

    .container h1 {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .container form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    form input, form select {
      width: 100%;
      padding: 1rem;
      font-size: 1.4rem;
      background: #f9f9f9;
      border: none; /* Sin borde */
      border-radius: .5rem;
    }

    form input:focus, form select:focus {
      background: #fff;
    }

    form button {
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: var(--primary-color);
      border-radius: 5px;
      cursor: pointer;
      box-shadow: var(--box-shadow);
      margin-top: 1rem;
      transition: background 0.3s, transform 0.2s;
      border: none; /* Sin borde */
    }

    form button:hover {
      background: var(--main-color);
      color: var(--primary-color);
      transform: scale(1.05);
    }

    .container p {
      margin-top: 1.5rem;
      font-size: 1.4rem;
      color: var(--black);
    }

    .container p a {
      color: var(--primary-color);
      font-weight: 600;
    }

    .container p a:hover {
      color: #882f2d;
    }

    /* Estilo para la flecha dentro del recuadro */
    .back-link {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-size: 2rem;
      color: var(--primary-color);
      cursor: pointer;
      text-decoration: none;
    }

    .back-link:hover {
      color: #882f2d;
    }

    /* Diseño Responsivo */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
      }

      .container h1 {
        font-size: 2.5rem;
      }

      .container form button {
        font-size: 1rem;
      }

      .container p {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem 1rem;
      }

      .container h1 {
        font-size: 2rem;
      }

      .container p {
        font-size: 1rem;
      }

      .container form button {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-link">↩</a>
    <h1>Iniciar Sesión</h1>
    <form id="loginForm">
      <input type="email" id="correo" placeholder="Correo" required>
      <input type="password" id="contrasena" placeholder="Contraseña" required>
      <select id="rol" required>
        <option value="">Selecciona tu rol</option>
        <option value="cliente">Cliente</option>
        <option value="repostero">Repostero</option>
      </select>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p>¿No tienes una cuenta? <a href="selectRegister.html">Regístrate</a></p>
  </div>
 <div id="alert" class="alert"></div>

  <script>
    // Detectar el cambio en el campo select
    document.getElementById('rol').addEventListener('change', function() {
      if (this.value === 'repostero') {
        // Redirigir al usuario a la vista de reposteros
        window.location.href = '../pasteleros/components/menu.html'; // Cambia esto a la URL de la vista de reposteros
      }
    });
  </script>

  <script src="../js/login.js"></script>
</body>
</html>
