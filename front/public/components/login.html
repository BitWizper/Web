<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background-color: #fdf7ef;
      --primary-color: #a33d3a;
      --text-color: #13131a;
      --box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    * {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
      border: none;
      text-decoration: none;
      transition: all .2s linear;
    }

    body {
      background: var(--background-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-size: 1.4rem; /* Tamaño de fuente igual al de Borcelle */
      color: var(--text-color);
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 3rem 2rem;
      border-radius: .5rem;
      box-shadow: var(--box-shadow);
      text-align: center;
      position: relative;
    }

    .container h2 {
      font-size: 3rem; /* Tamaño de fuente igual al de Borcelle */
      margin-bottom: 1rem;
      color: var(--primary-color);
    }

    .container form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    form input {
      width: 100%;
      padding: 1rem;
      font-size: 1.6rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: .5rem;
      background: #f9f9f9;
    }

    form input:focus {
      border: 1px solid var(--primary-color);
      background: #fff;
    }

    form button {
      padding: 1rem 2rem;
      font-size: 1.7rem; /* Tamaño de fuente igual al de Borcelle */
      color: #fff;
      background: var(--primary-color);
      border-radius: .5rem;
      cursor: pointer;
      box-shadow: var(--box-shadow);
    }

    form button:hover {
      background: #882f2d;
    }

    .container p {
      margin-top: 1.5rem;
      font-size: 1.4rem;
      color: var(--text-color);
    }

    .container p a {
      color: var(--primary-color);
      font-weight: 600;
    }

    .container p a:hover {
      color: #882f2d;
    }

    /* Estilos para la alerta */
    .alert {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4d4d;
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 5px;
      box-shadow: var(--box-shadow);
      text-align: center;
      font-size: 1.4rem;
      z-index: 1000;
    }

    .alert.success {
      background: #28a745;
    }

    /* Estilo para la flecha dentro del recuadro */
    .back-link {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-size: 2rem; /* Tamaño de la flecha */
      color: var(--primary-color);
      cursor: pointer;
      text-decoration: none;
    }

    .back-link:hover {
      color: #882f2d;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-link">↩</a> <!-- Flecha cambiada -->
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <input type="email" id="correo" placeholder="Correo" required>
      <input type="password" id="contrasena" placeholder="Contraseña" required>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p>¿No tienes una cuenta? <a href="register.html">Regístrate</a></p>
  </div>

  <div id="alert" class="alert"></div>

  <script src="../js/login.js"></script>
</body>
</html>
