<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Repostero</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #dfb47a; /* Dorado pastel */
      --primary-color: #a63d40; /* Burdeos */
      --secondary-color: #f8f1e7; /* Beige claro */
      --black: #13131a;
      --box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
    }

    * {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      text-decoration: none;
      transition: all .3s ease-in-out;
    }

    body {
      background: url('https://i.pinimg.com/736x/be/99/c4/be99c4ada20cedd3ded33bcf9e53374f.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    /* Overlay para mejorar legibilidad */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      background: var(--secondary-color);
      padding: 3rem 2rem;
      border-radius: 10px;
      box-shadow: var(--box-shadow);
      max-width: 450px;
      width: 90%;
    }

    .container h2 {
      font-size: 2rem; /* Título más pequeño */
      margin-bottom: 1.5rem;
      color: var(--primary-color);
      font-weight: 700;
      text-align: center; /* Centraliza el título */
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem; /* Espacio entre campos */
    }

    form input,
    form textarea {
      width: 100%;
      padding: 1rem;
      font-size: 1.4rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: .5rem;
      background: #f9f9f9;
    }

    form input:focus,
    form textarea:focus {
      border: 1px solid var(--primary-color);
      background: #fff;
    }

    form button {
      padding: 1rem;
      font-size: 1.2rem;
      color: #fff;
      background: var(--primary-color);
      border-radius: .5rem;
      cursor: pointer;
      box-shadow: var(--box-shadow);
      transition: background 0.3s, transform 0.2s;
      border: none;
    }

    form button:hover {
      background: var(--main-color);
      color: var(--primary-color);
      transform: scale(1.05);
    }

    .container p {
      margin-top: 1.2rem;
      font-size: 1.3rem;
      color: var(--black);
      text-align: center; /* Centraliza la pregunta */
    }

    .container p a {
      color: var(--primary-color);
      font-weight: 600;
    }

    .container p a:hover {
      color: var(--main-color);
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>Registro de Repostero</h2>
    <form id="registerReposteroForm">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="email" id="correo" placeholder="Correo" required>
      <input type="password" id="contrasena" placeholder="Contraseña (8 caracteres)" required>
      <input type="text" id="direccion" placeholder="Dirección" required>
      <input type="text" id="telefono" placeholder="Teléfono (10 dígitos)" required>

      <h2 style="font-size: 1.8rem; margin-top: 1.5rem; text-align: center;">Información del Negocio</h2>
      <input type="text" id="NombreNegocio" placeholder="Nombre del Negocio" required>
      <input type="text" id="Ubicacion" placeholder="Ubicación" required>
      <textarea id="Especialidades" placeholder="Especialidades" required></textarea>
      <input type="url" id="PortafolioURL" placeholder="URL del Portafolio (opcional)">
      
      <button type="submit">Crear Cuenta</button>
    </form>
    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>

  <script src="../js/register-repostero.js"></script>
</body>
</html>
