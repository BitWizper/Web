<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Repostero</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #dfd090;
      --primary-color: #800020;
      --black: #13131a;
      --box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
    }

    * {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
      border: none;
      text-decoration: none;
      text-transform: capitalize;
      transition: all .2s linear;
    }

    body {
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: #fff;
      padding: 2.5rem;
      border-radius: .5rem;
      box-shadow: var(--box-shadow);
      text-align: center;
    }

    .container h2 {
      font-size: 2.4rem;
      margin-bottom: 1.5rem;
      color: var(--primary-color);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: .5rem;
      background: #f9f9f9;
    }

    form input:focus,
    form textarea:focus {
      border: 1px solid var(--primary-color);
      background: #fff;
    }

    form textarea {
      resize: none;
      height: 80px;
    }

    form button {
      padding: 1rem 2rem;
      font-size: 1.6rem;
      color: #fff;
      background: var(--primary-color);
      border-radius: .5rem;
      cursor: pointer;
      box-shadow: var(--box-shadow);
    }

    form button:hover {
      background: var(--main-color);
      color: var(--primary-color);
    }

    .container p {
      margin-top: 1.2rem;
      font-size: 1.3rem;
      color: var(--black);
    }

    .container p a {
      color: var(--primary-color);
      font-weight: 600;
    }

    .container p a:hover {
      color: var(--main-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Registro de Repostero</h2>
    <form id="registerReposteroForm">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="email" id="correo" placeholder="Correo" required>
      <input type="password" id="contrasena" placeholder="Contraseña (8 caracteres)" required>
      <input type="text" id="direccion" placeholder="Dirección" required>
      <input type="text" id="telefono" placeholder="Teléfono (10 dígitos)" required>

      <h2 style="font-size: 1.8rem; margin-top: 1.5rem;">Información del Negocio</h2>
      <input type="text" id="NombreNegocio" placeholder="Nombre del Negocio" required>
      <input type="text" id="Ubicacion" placeholder="Ubicación" required>
      <textarea id="Especialidades" placeholder="Especialidades" required></textarea>
      <input type="url" id="PortafolioURL" placeholder="URL del Portafolio (opcional)">
      
      <button type="submit">Crear Cuenta</button>
    </form>
    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>

  <script src="../js/register-repostero.js"></script>
</body>
</html>
