<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Mi Perfil</h3>
      <div class="option" onclick="window.location.href='editar_perfil.html'">
        <i class="fas fa-user-edit"></i>
        <span>Editar Perfil</span>
      </div>
      <div class="option">
        <i class="fas fa-bell"></i>
        <span>Notificaciones</span>
      </div>
      <div class="option">
        <i class="fas fa-credit-card"></i>
        <span>Mi tarjeta</span>
      </div>
      <div class="option">
        <i class="fas fa-cog"></i>
        <span>Configuración</span>
      </div>
    </div>

    <!-- Perfil -->
    <div class="profile-container">
      <div class="header">
        <span class="back-btn" onclick="window.location.href='home.html'">&#8592;</span>
      </div>
      <div class="profile">
        <div class="profile-img">
          <img src="https://i.pinimg.com/736x/5e/20/14/5e201432edf89a85fe7b5e81ddef8f25.jpg" alt="Foto de perfil">
        </div>
        <div class="profile-info">
          <h3>Alessandra S.</h3>
          <p>¡Bienvenida a mi perfil! Soy una persona que ama la tecnología y siempre está buscando nuevas oportunidades para aprender y mejorar.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
