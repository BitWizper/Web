<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Pasteles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/categorias.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="left-section">
            <a href="#" id="menu" class="menu-icon"><i class="fas fa-bars"></i></a> 
            <a href="#" class="logo"><i class="fas fa-cake"></i></a> 
        </div>

        <nav class="navbar">
            <a href="home.html" class="active">Home</a>
            <a href="categorias.html">Pasteles</a>
            <a href="reposteros.html">Reposteros</a>
            <a href="loadingCake.html">Crear Pastel</a>
        </nav>

        <div class="header-right">
            <div class="search-bar">
                <input type="text" placeholder="Buscar aquí..." class="search-input">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-section">
                <a href="#" title="Notificaciones">
                    <i class="fas fa-bell fa-lg"></i> 
                </a>
            </div>
            <div class="cart-section">
                <a href="#" id="cart-icon" title="Carrito de Compras">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Sección de título -->
    <div class="heading-title" style="background: url(https://static.vecteezy.com/system/resources/previews/040/459/837/non_2x/ai-generated-a-birthday-cake-in-pink-adorned-with-golden-candles-and-balloons-free-photo.jpg) no-repeat;">
        <h1>Catálogo</h1>
    </div>

    <!-- Sección de Categorías -->
    <section class="category">
        <div class="categorias">
            <button class="categoria" data-categoria="1">
                <img src="../img/xv años.png" alt="XV Años">
                <p>XV Años</p>
            </button>
            <button class="categoria" data-categoria="2">
                <img src="../img/cumpleaños.png" alt="Cumpleaños">
                <p>Cumpleaños</p>
            </button>
            <button class="categoria" data-categoria="3">
                <img src="../img/babyshower.png" alt="Baby Shower">
                <p>Baby Shower</p>
            </button>
            <button class="categoria" data-categoria="4">
                <img src="../img/boda2.png" alt="Boda">
                <p>Boda</p>
            </button>
            <button class="categoria" data-categoria="5">
                <img src="../img/bautizo.png" alt="Bautizo">
                <p>Bautizo</p>
            </button>
        </div>
    </section>

    <!-- Sección de Pasteles -->
    <section class="menu">
        <h1 class="heading">Pasteles</h1>
        <div class="pasteles-container" id="pastelesContainer">
            <!-- Aquí se cargarán los pasteles dinámicamente -->
        </div>
        <button id="mostrarMas" class="mostrar-mas" style="display: none;">Mostrar más</button>
        <button id="mostrarMenos" class="mostrar-mas" style="display: none;">Mostrar menos</button>
    </section>
    <!-- footer section starts -->
    <section class="footer">
        <div class="box-container">
            <div class="box">
                <h3>quick links</h3>
                <a href="/components/home.html"> <i class="fas fa-arrow-right"></i> Home</a>
                <a href="/components/reposteros.html"> <i class="fas fa-arrow-right"></i> Reposteros</a>
                <a href="components/categorias.html"> <i class="fas fa-arrow-right"></i> Catalogo</a>
                <a href="components/ayuda.html"> <i class="fas fa-arrow-right"></i> Centro de ayuda</a>
            </div>
            <div class="box">
                <h3>extra links</h3>
                <a href="#"> <i class="fas fa-arrow-right"></i> mis pedidos</a>
                <a href="#"> <i class="fas fa-arrow-right"></i> mis favoritos</a>
                <a href="#"> <i class="fas fa-arrow-right"></i> mi carrito</a>
                <a href="/components/perfil.html"> <i class="fas fa-arrow-right"></i> mi perfil</a>
                <a href="#"> <i class="fas fa-arrow-right"></i> política y privacidad</a>
            </div>
            <div class="box">
                <h3>Síguenos</h3>
                <a href="#"> <i class="fab fa-facebook-f"></i> facebook</a>
                <a href="#"> <i class="fab fa-twitter"></i> twitter</a>
                <a href="#"> <i class="fab fa-instagram"></i> instagram</a>
                <a href="#"> <i class="fab fa-linkedin"></i> linkedin</a>
                <a href="#"> <i class="fab fa-pinterest"></i> pinterest</a>
            </div>
            
        </div>
    </section>
    <section class="credit"></section>
    <!-- footer section ends -->

    <script src="../js/categoria.js"></script>

</body>
</html>
