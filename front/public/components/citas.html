<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - Pastelería</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            font-size: 3rem;
            color: var(--main-color);
            cursor: pointer;
            z-index: 100;
        }

        .back-btn:hover {
            color: var(--black);
        }

        .citas-container {
            max-width: 1200px;
            margin: 4rem auto 2rem;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 1rem;
        }

        .calendar-title {
            font-size: 3rem;
            color: var(--main-color);
        }

        .month-title {
            font-size: 2rem;
            color: var(--black);
            text-align: center;
            margin-bottom: 2rem;
        }

        .calendar-nav {
            display: flex;
            gap: 1rem;
        }

        .calendar-nav button {
            background: var(--main-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1.4rem;
            transition: all 0.3s ease;
        }

        .calendar-nav button:hover {
            background: var(--black);
            transform: translateY(-2px);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .weekday {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--main-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 0.8rem;
        }

        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid #ddd;
            border-radius: 0.8rem;
            padding: 1rem;
            position: relative;
            background: white;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .calendar-day.empty {
            background: #f5f5f5;
            border: none;
        }

        .calendar-day:hover:not(.empty) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .calendar-date {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--black);
        }

        .calendar-event {
            background: var(--main-color);
            color: white;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-event:hover {
            transform: scale(1.05);
        }

        .calendar-event.degustacion {
            background: var(--main-color);
        }

        .calendar-event.muestra {
            background: var(--main-color);
        }

        .cita-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .cita-modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 1rem;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cita-modal-close {
            position: absolute;
            right: 2rem;
            top: 1rem;
            font-size: 2.8rem;
            cursor: pointer;
            color: #aaa;
            transition: color 0.3s ease;
        }

        .cita-modal-close:hover {
            color: var(--main-color);
        }

        .cita-detalles {
            margin-top: 2rem;
        }

        .cita-detalles h3 {
            color: var(--main-color);
            font-size: 2rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 0.5rem;
        }

        .cita-info {
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        .cita-info p {
            margin: 1rem 0;
            padding: 0.5rem;
            border-radius: 0.5rem;
            background: #f9f9f9;
        }

        .cita-info strong {
            color: var(--main-color);
            margin-right: 0.5rem;
        }

        .cita-acciones {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .cita-acciones button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reagendar {
            background: var(--main-color);
            color: white;
        }

        .btn-reagendar:hover {
            background: var(--black);
        }

        .btn-cancelar {
            background: #A65168;
            color: white;
        }

        .btn-cancelar:hover {
            background: #8B3D52;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
            }

            .calendar-day {
                aspect-ratio: auto;
                min-height: 80px;
                padding: 0.5rem;
            }

            .calendar-date {
                font-size: 1.2rem;
            }

            .calendar-event {
                font-size: 1rem;
                padding: 0.5rem;
            }

            .citas-container {
                margin: 4rem 1rem 2rem;
                padding: 1rem;
            }

            .weekday {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <span class="back-btn" onclick="window.location.href='home.html'">↩</span>

    <div class="citas-container">
        <div class="calendar-header">
            <h1 class="calendar-title">Mis Citas</h1>
            <div class="calendar-nav">
                <button onclick="cambiarMes(-1)"><i class="fas fa-chevron-left"></i></button>
                <button onclick="cambiarMes(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <h2 class="month-title" id="monthTitle"></h2>

        <div class="weekdays">
            <div class="weekday">Dom</div>
            <div class="weekday">Lun</div>
            <div class="weekday">Mar</div>
            <div class="weekday">Mié</div>
            <div class="weekday">Jue</div>
            <div class="weekday">Vie</div>
            <div class="weekday">Sáb</div>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- Los días del calendario se generarán aquí -->
        </div>
    </div>

    <!-- Modal para ver detalles de la cita -->
    <div id="citaModal" class="cita-modal">
        <div class="cita-modal-content">
            <span class="cita-modal-close" onclick="cerrarModal()">&times;</span>
            <div class="cita-detalles" id="citaDetalles">
                <!-- Los detalles de la cita se mostrarán aquí -->
            </div>
        </div>
    </div>

    <script>
        let fechaActual = new Date();
        let citasGuardadas = [];

        function cargarCitas() {
            citasGuardadas = JSON.parse(localStorage.getItem('misCitas')) || [];
            generarCalendario();
        }

        function generarCalendario() {
            const primerDia = new Date(fechaActual.getFullYear(), fechaActual.getMonth(), 1);
            const ultimoDia = new Date(fechaActual.getFullYear(), fechaActual.getMonth() + 1, 0);
            const diasTotales = ultimoDia.getDate();
            const primerDiaSemana = primerDia.getDay();

            // Actualizar título del mes
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            document.getElementById('monthTitle').textContent = `${meses[fechaActual.getMonth()]} ${fechaActual.getFullYear()}`;

            let gridHTML = '';
            
            // Días vacíos antes del primer día del mes
            for (let i = 0; i < primerDiaSemana; i++) {
                gridHTML += '<div class="calendar-day empty"></div>';
            }

            // Días del mes
            for (let dia = 1; dia <= diasTotales; dia++) {
                const fecha = new Date(fechaActual.getFullYear(), fechaActual.getMonth(), dia);
                const citasDelDia = citasGuardadas.filter(cita => {
                    const fechaCita = new Date(cita.fecha);
                    return fechaCita.getDate() === dia && 
                           fechaCita.getMonth() === fecha.getMonth() && 
                           fechaCita.getFullYear() === fecha.getFullYear();
                });

                gridHTML += `
                    <div class="calendar-day">
                        <div class="calendar-date">${dia}</div>
                        ${citasDelDia.map(cita => `
                            <div class="calendar-event degustacion" onclick="mostrarDetalleCita('${cita.id_cita}')">
                                ${cita.hora} - Degustación
                            </div>
                        `).join('')}
                    </div>`;
            }

            document.getElementById('calendarGrid').innerHTML = gridHTML;
        }

        function cambiarMes(delta) {
            fechaActual = new Date(fechaActual.getFullYear(), fechaActual.getMonth() + delta, 1);
            generarCalendario();
        }

        function mostrarDetalleCita(idCita) {
            const cita = citasGuardadas.find(c => c.id_cita === idCita);
            if (!cita) return;

            const detallesHTML = `
                <h3>Detalles de la Cita</h3>
                <div class="cita-info">
                    <p><strong>Fecha:</strong> ${new Date(cita.fecha).toLocaleDateString()}</p>
                    <p><strong>Hora:</strong> ${cita.hora}</p>
                    <p><strong>Repostero:</strong> ${cita.repostero.nombre}</p>
                    <p><strong>Tipo de Pastel:</strong> ${cita.tipo_pastel}</p>
                    <p><strong>Estado:</strong> ${cita.estado}</p>
                    ${cita.notas ? `<p><strong>Notas:</strong> ${cita.notas}</p>` : ''}
                </div>
                <div class="cita-acciones">
                    <button class="btn-reagendar" onclick="reagendarCita('${idCita}')">Reagendar</button>
                    <button class="btn-cancelar" onclick="cancelarCita('${idCita}')">Cancelar Cita</button>
                </div>`;

            document.getElementById('citaDetalles').innerHTML = detallesHTML;
            document.getElementById('citaModal').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('citaModal').style.display = 'none';
        }

        function reagendarCita(idCita) {
            // Implementar la lógica de reagendar
            alert('Función de reagendar en desarrollo');
        }

        function cancelarCita(idCita) {
            if (confirm('¿Estás seguro de que deseas cancelar esta cita?')) {
                citasGuardadas = citasGuardadas.filter(c => c.id_cita !== idCita);
                localStorage.setItem('misCitas', JSON.stringify(citasGuardadas));
                cerrarModal();
                generarCalendario();
            }
        }

        // Cerrar modal al hacer clic fuera de él
        window.onclick = function(event) {
            const modal = document.getElementById('citaModal');
            if (event.target === modal) {
                cerrarModal();
            }
        }

        // Cargar las citas cuando se carga la página
        document.addEventListener('DOMContentLoaded', cargarCitas);
    </script>
</body>
</html>
