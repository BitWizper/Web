<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reposteros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../css/reposteros.css">
</head>
<body>
    <header class="header">
        <div class="left-section">
            <a href="#" id="menu" class="menu-icon"><i class="fas fa-bars"></i></a> 
            <a href="#" class="logo"><i class="fas fa-cake"></i></a> 
        </div>
        
        <nav class="navbar">
            <a href="home.html" class="active">Home</a>
            <a href="categorias.html">Pasteles</a>
            <a href="reposteros.html">Reposteros</a>
            <a href="#">Crear Pastel</a>
        </nav>
        
        <div class="header-right">
            <div class="search-bar">
                <input type="text" placeholder="Search here..." class="search-input">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="profile-section">                                                       
                <a href="perfil.html" title="Profile">
                    <i class="fas fa-user-circle fa-lg"></i>
                </a>
            </div>
            <div class="cart-section">
                <a href="#" id="cart-icon" title="Shopping Cart">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                </a>
            </div>
        </div>
    </header>

    <div class="heading-title" style="background: url('http://beechefpastryschool.com/wp-content/uploads/2021/08/Bee-Chef-26-7-19-8848.jpg') no-repeat;">
        <h1>Reposteros</h1>
    </div>

    <section id="catalogo-reposteros" class="section">
        
        <div class="reposteros-container" id="reposteros">
            <!-- Reposteros serán generados dinámicamente -->
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const reposteros = [
                {nombre: "Ana Martínez", imagen: "../img/repostera1.jpg"},
                {nombre: "emiliana López", imagen: "../img/repostera2.jpg"},
                {nombre: "Mario Pérez", imagen: "../img/repostero3.jpg"},
                {nombre: "Pastelería Ana María", imagen: "https://pasteleriaanamaria.com/images/logo-ana.png"},
                {nombre: "Kenysse Pasteles Fondant Mérida", imagen: "../img/repostero3.jpg"},
                {nombre: "La Pastelería de París", imagen: "../img/repostero3.jpg"},
                {nombre: "Bachour Café", imagen: "../img/repostero3.jpg"},
                {nombre: "Catalina", imagen: "../img/repostero3.jpg"},
                {nombre: "Aroma a Pan", imagen: "../img/repostero3.jpg"},
                {nombre: "Socó", imagen: "../img/repostero3.jpg"},

                
    
                
            ];

            const container = document.getElementById("reposteros");
            
            reposteros.forEach(repostero => {
                const card = document.createElement("div");
                card.classList.add("repostero-card");
                
                card.innerHTML = `
                    <div class="favorite" onclick="toggleFavorite(this)">
                        <i class="far fa-heart"></i>
                    </div>
                    <img src="${repostero.imagen}" alt="${repostero.nombre}">
                    <h3>${repostero.nombre}</h3>
                    <a href="#" class="ver-perfil">Ver Perfil</a>
                `;
                
                container.appendChild(card);
            });
        });

        function toggleFavorite(icon) {
            icon.classList.toggle("active");
            icon.innerHTML = icon.classList.contains("active") 
                ? '<i class="fas fa-heart" style="color: red;"></i>' 
                : '<i class="far fa-heart"></i>';
        }
    </script>
</body>
</html>
