<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reposteros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <div class="left-section">
            <a href="#" id="menu" class="menu-icon"><i class="fas fa-bars"></i></a> 
            <a href="#" class="logo"><i class="fas fa-cake"></i></a> 
        </div>
        <nav class="navbar">
            <a href="home.html" class="active">Home</a>
            <a href="categorias.html">Pasteles</a>
            <a href="reposteros.html">Reposteros</a>
            <a href="#">Crear Pastel</a>
        </nav>
    </header>
    
    <div class="heading-title" style="background: url('https://i.pinimg.com/736x/ea/66/f9/ea66f963dc334e7aed104508ee4f30fb.jpg') no-repeat;">
        <h1>Reposteros</h1>
    </div>

    <section id="catalogo-reposteros" class="section">
        <h2>Catálogo de Reposteros</h2>
        <div class="reposteros-grid">
            <div class="repostero-card" data-id="1">
                <i class="far fa-heart favorito"></i>
                <img src="../images/repostero1.jpg" alt="Repostero 1">
                <h3>Maria González</h3>
                <p>Especialista en pasteles temáticos y fondant.</p>
                <a href="perfil-repostero.html">Ver Perfil</a>
            </div>
            <div class="repostero-card" data-id="2">
                <i class="far fa-heart favorito"></i>
                <img src="../images/repostero2.jpg" alt="Repostero 2">
                <h3>Juan Pérez</h3>
                <p>Experto en repostería artesanal y cupcakes.</p>
                <a href="perfil-repostero.html">Ver Perfil</a>
            </div>
        </div>
    </section>
    
    <script>
        document.querySelectorAll('.favorito').forEach(heart => {
            heart.addEventListener('click', function() {
                this.classList.toggle('fas'); // Cambia de far (vacío) a fas (relleno)
                this.classList.toggle('text-red'); // Cambia el color
            });
        });
    </script>
</body>
</html>
