<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pasteles Favoritos</title>
    <link rel="stylesheet" href="../css/favoritos.css">
</head>
<body>
    <h1>Mis Pasteles Favoritos</h1>
    
    <!-- Contenedor donde se mostrarán los pasteles favoritos -->
    <div id="favoritosContainer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("El DOM ha sido cargado.");

            const favoritosContainer = document.getElementById("favoritosContainer");
            const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            console.log("Favoritos en localStorage:", favoritos);

            if (favoritos.length === 0) {
                favoritosContainer.innerHTML = "<p>No tienes pasteles favoritos.</p>";
            } else {
                cargarPastelesFavoritos(favoritos);
            }
        });

        async function cargarPastelesFavoritos(favoritos) {
            try {
                const response = await fetch('http://localhost:3000/api/pastel/obtenerpasteles');
                const pasteles = await response.json();
                
                console.log("Datos obtenidos de la API:", pasteles);

                const pastelesFavoritos = pasteles.filter(pastel => favoritos.includes(pastel.id_pastel));
                
                console.log("Pasteles favoritos filtrados:", pastelesFavoritos);

                if (pastelesFavoritos.length > 0) {
                    favoritosContainer.innerHTML = pastelesFavoritos.map(pastel => `
                        <div class="pastel">
                            <img src="${pastel.imagen_url}" alt="${pastel.nombre}">
                            <p>${pastel.nombre}</p>
                            <div class="icons">
                                <button onclick="eliminarDeFavoritos(${pastel.id_pastel})">❌ Eliminar</button>
                                <button onclick="editarPastel(${pastel.id_pastel})">✏️ Editar</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    favoritosContainer.innerHTML = "<p>No tienes pasteles favoritos.</p>";
                }
            } catch (error) {
                console.error("Error al obtener los pasteles desde la base de datos:", error);
                favoritosContainer.innerHTML = "<p>No se pudo cargar la información de los pasteles.</p>";
            }
        }

        function eliminarDeFavoritos(id_pastel) {
            let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
            favoritos = favoritos.filter(id => id !== id_pastel);
            localStorage.setItem("favoritos", JSON.stringify(favoritos));

            alert(`❌ Pastel eliminado de favoritos.`);
            location.reload(); // Recargar la página para actualizar la lista
        }

        function editarPastel(id_pastel) {
            window.location.href = `editar-pastel.html?id_pastel=${id_pastel}`;
        }
    </script>
</body>
</html>
