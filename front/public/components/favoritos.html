<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Mis Pasteles Favoritos 🎂</h1>
    <div id="favoritosContainer"></div>
    <a href="index.html">Volver a Inicio</a>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const favoritosContainer = document.getElementById("favoritosContainer");
            const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

            if (favoritos.length === 0) {
                favoritosContainer.innerHTML = "<p>No tienes pasteles favoritos aún.</p>";
                return;
            }

            favoritosContainer.innerHTML = favoritos.map(pastel => `
                <div class="pastel">
                    <img src="${pastel.imagen_url}" alt="${pastel.nombre}">
                    <p>${pastel.nombre}</p>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
