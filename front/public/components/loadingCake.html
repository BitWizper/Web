<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: url('../img/cake.jpg') no-repeat center center/cover;
            color: white;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }

        .loader-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        .text {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="loader-container">
        <div class="loader"></div>
        <p class="text">Cargando...</p>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "../mainMenuModel3D/mainMenuUI.html";
        }, 3000); // Redirige después de 4 segundos
    </script>

</body>
</html>
