<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borcelle - Personalización de Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-color: #dfb47a; /* Dorado pastel */
      --primary-color: #a63d40; /* Burdeos */
      --secondary-color: #f8f1e7; /* Beige claro */
      --black: #13131a;
      --box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1);
    }

    * {
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      text-decoration: none;
      transition: all .3s ease-in-out;
    }

    body {
      background: url('https://i.pinimg.com/736x/be/99/c4/be99c4ada20cedd3ded33bcf9e53374f.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
    }

    /* Overlay para mejorar legibilidad */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      background: var(--secondary-color);
      padding: 3rem 2rem;
      border-radius: 10px;
      box-shadow: var(--box-shadow);
      max-width: 400px;
      width: 90%;
    }

    .container h1 {
      font-size: 3rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .container p {
      font-size: 1.4rem;
      color: var(--black);
      margin-bottom: 2rem;
    }

    .container button {
      display: block;
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: var(--primary-color);
      border-radius: 5px;
      cursor: pointer;
      box-shadow: var(--box-shadow);
      border: none;
      margin-bottom: 1rem;
      transition: background 0.3s, transform 0.2s;
    }

    .container button:hover {
      background: var(--main-color);
      color: var(--primary-color);
      transform: scale(1.05);
    }

    /* Diseño Responsivo */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
      }

      .container h1 {
        font-size: 2.5rem;
      }

      .container p {
        font-size: 1.2rem;
      }

      .container button {
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem 1rem;
      }

      .container h1 {
        font-size: 2rem;
      }

      .container p {
        font-size: 1rem;
      }

      .container button {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Borcelle</h1>
    <p>Lo hace posible</p>
    <button onclick="window.location.href='components/login.html'">Iniciar Sesión</button>
    <button onclick="window.location.href='components/selectRegister.html'">Crear Cuenta</button>
  </div>
</body>
</html>
